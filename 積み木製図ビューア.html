<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>積み木製図ビューア</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 配置: 製図用紙(方眼)を主役に、真上から見た段数の入力盤を横(狭い画面では下)に置く。青焼き図面の青を唯一のアクセントにする。 */
:root {
  --paper: #F1F5F9;
  --sheet: #FFFFFF;
  --ink: #13202C;
  --ink-soft: #4A5B6B;
  --rule: #C9D4DE;
  --accent: #1F5FBF;
  --accent-ink: #FFFFFF;
  --face-top: #F7FAFD;
  --face-front: #D9E6F4;
  --face-right: #B9CEE8;
  --ortho-fill: #E4EDF7;
  --line: #13202C;
  --line-thin: #8FA3B6;
  --grid-dot: #E3EAF0;
  --font-text: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1620;
    --sheet: #112131;
    --ink: #E5EEF6;
    --ink-soft: #9EB1C3;
    --rule: #26394B;
    --accent: #6FA8FF;
    --accent-ink: #08121C;
    --face-top: #3A5A7A;
    --face-front: #28435E;
    --face-right: #1B3148;
    --ortho-fill: #1C3450;
    --line: #DCE8F3;
    --line-thin: #5B7690;
    --grid-dot: #18293A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1620;
  --sheet: #112131;
  --ink: #E5EEF6;
  --ink-soft: #9EB1C3;
  --rule: #26394B;
  --accent: #6FA8FF;
  --accent-ink: #08121C;
  --face-top: #3A5A7A;
  --face-front: #28435E;
  --face-right: #1B3148;
  --ortho-fill: #1C3450;
  --line: #DCE8F3;
  --line-thin: #5B7690;
  --grid-dot: #18293A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 15px;
  line-height: 1.65;
  padding-block: 22px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 1080px; margin: 0 auto; }
h1 { margin: 0; font-size: clamp(22px, 4.5vw, 30px); font-weight: 700; letter-spacing: 0.03em; text-wrap: balance; }
.lede { margin: 6px 0 20px; color: var(--ink-soft); max-width: 40em; }
h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }

.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 880px) {
  .layout { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
}
.col { min-width: 0; display: flex; flex-direction: column; gap: 12px; }

.btn {
  font: inherit; min-height: 40px; padding: 6px 14px;
  border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
  border-radius: 6px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .cell:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[aria-selected="true"], .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; min-height: 38px; padding-inline: 14px; }
.seg .btn + .btn { border-left: 1px solid var(--rule); }

.sheet {
  /* 製図用紙はテーマに関係なく、いつも白い紙として扱う(テスト用紙にそのまま使えるように) */
  --ink-soft: #4A5B6B;
  --face-top: #F7FAFD;
  --face-front: #D9E6F4;
  --face-right: #B9CEE8;
  --ortho-fill: #E4EDF7;
  --line: #13202C;
  --line-thin: #8FA3B6;
  --grid-dot: #DCE4EC;
  position: relative; min-height: 300px; padding: 22px 14px;
  background-color: #FFFFFF;
  background-image: linear-gradient(var(--grid-dot) 1px, transparent 1px), linear-gradient(90deg, var(--grid-dot) 1px, transparent 1px);
  background-size: 24px 24px;
  border: 1px solid var(--rule); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
}
.sheet svg { display: block; height: auto; max-width: 100%; }
.sheet.nogrid { background-image: none; }
.sheet.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px 16px; align-items: end; }
.sheet.multi figure { margin: 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.sheet.multi figure.wide { grid-column: 1 / -1; }
.sheet figcaption { font-weight: 700; font-size: 14px; color: var(--ink-soft); }
.empty { margin: 0; color: var(--ink-soft); text-align: center; max-width: 24em; }

.solid polygon { stroke: var(--line); stroke-width: 1.4; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.f-top { fill: var(--face-top); }
.f-front { fill: var(--face-front); }
.f-right { fill: var(--face-right); }
.noshade .f-front, .noshade .f-right { fill: var(--face-top); }
.ofill rect { fill: var(--ortho-fill); }
.o-bold { fill: none; stroke: var(--line); stroke-width: 2.2; stroke-linecap: square; vector-effect: non-scaling-stroke; }
.o-thin { fill: none; stroke: var(--line-thin); stroke-width: 1; stroke-linecap: square; vector-effect: non-scaling-stroke; }
.lab { fill: var(--ink-soft); font-family: var(--font-text); font-weight: 700; }
.axis line { stroke: var(--ink-soft); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.axis polygon { fill: var(--ink-soft); }
.axis text { fill: var(--ink); font-family: var(--font-mono); font-size: 13px; }

.note { margin: 0; color: var(--ink-soft); font-size: 14px; max-width: 46em; }
.opts { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.opts label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.opts input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.opts .lbl { color: var(--ink-soft); margin-right: 8px; }

.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.stats { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.legend { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: 13px; }

.editor { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.editor p { margin: 0; color: var(--ink-soft); font-size: 13px; }
.plan-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.edge-lab { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.08em; }
.plan { display: grid; gap: 4px; width: 100%; max-width: 320px; }
.cell {
  aspect-ratio: 1; min-width: 0; padding: 0;
  border: 1px solid var(--rule); border-radius: 4px;
  background: color-mix(in srgb, var(--accent) calc(var(--p, 0) * 1%), var(--sheet));
  color: var(--ink); font: 500 18px var(--font-mono); cursor: pointer;
}
.cell:hover { border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .lbl { color: var(--ink-soft); font-size: 13px; margin-right: 2px; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets .btn { min-height: 38px; padding-inline: 12px; }

.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:disabled { opacity: 0.5; cursor: default; }
.exportbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.exportbar .msg { color: var(--ink-soft); font-size: 14px; }
.preview { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.preview p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.preview img { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); background: #FFFFFF; }
</style>

<main>
  <header>
    <h1>積み木製図ビューア</h1>
    <p class="lede">立方体を積み上げて、同じ立体を等角図・キャビネット図・正投影図で見比べます。</p>
  </header>

  <div class="layout">
    <section class="col" aria-label="製図用紙">
      <div class="tabs" role="tablist" id="tabs" aria-label="図の種類"></div>
      <div class="sheet" id="sheet"></div>
      <p class="note" id="note"></p>
      <div class="opts">
        <span><span class="lbl">用紙</span><span class="seg" id="paperSeg"></span></span>
        <span id="angleOpt" hidden><span class="lbl">奥行きの角度</span>
          <span class="seg" id="angleSeg"></span></span>
        <label id="shadeOpt"><input type="checkbox" id="shade" checked>面に濃淡をつける</label>
        <label id="gridOpt"><input type="checkbox" id="grid" checked>同じ高さの面の境目線を細線で表示</label>
        <label id="labelOpt" hidden><input type="checkbox" id="labels" checked>図の名前(平面図など)を表示</label>
      </div>
      <div class="exportbar">
        <button class="btn primary" type="button" id="export">JPEGで保存</button>
        <span class="msg" id="exportMsg" role="status" aria-live="polite"></span>
      </div>
      <div class="preview" id="preview" hidden></div>
      <div class="foot">
        <div class="legend" id="legend"></div>
        <div class="stats" id="stats"></div>
      </div>
    </section>

    <section class="editor" aria-label="立体の入力">
      <div>
        <h2>立体をつくる</h2>
        <p>真上から見た図です。マスをタップすると、その場所の立方体が1個ずつ増減します。</p>
      </div>
      <div class="row">
        <span class="lbl">タップで</span>
        <span class="seg" id="modeSeg">
          <button class="btn" type="button" data-mode="add" aria-pressed="true">積む</button>
          <button class="btn" type="button" data-mode="remove" aria-pressed="false">取る</button>
        </span>
      </div>
      <div class="plan-wrap">
        <span class="edge-lab">奥</span>
        <div class="plan" id="plan"></div>
        <span class="edge-lab">手前(正面側)</span>
      </div>
      <div class="row">
        <span class="lbl">盤の広さ</span>
        <span class="seg" id="sizeSeg"></span>
      </div>
      <div>
        <p style="margin-bottom:6px">例の形</p>
        <div class="presets" id="presets"></div>
      </div>
    </section>
  </div>
</main>

<script>
(function () {
  var MAXH = 6;
  var N = 5;
  var h = makeEmpty(N);
  var view = 'iso', angle = 45, mode = 'add', showGrid = true, shade = true;
  var paperGrid = true, showLabels = true, dl = null;

  var $ = function (s) { return document.querySelector(s); };
  var planEl = $('#plan'), sheetEl = $('#sheet');

  function makeEmpty(n) {
    var a = [];
    for (var i = 0; i < n; i++) { a.push(new Array(n).fill(0)); }
    return a;
  }

  /* ---------- 例の形 (上の行が奥、下の行が手前) ---------- */
  var PRESETS = [
    ['例題', ['00000', '00000', '03000', '12100', '11100']],
    ['階段', ['00000', '00000', '00000', '12340', '12340']],
    ['ピラミッド', ['00000', '01110', '01210', '01110', '00000']],
    ['L字', ['00000', '00000', '30000', '30000', '31110']]
  ];
  function applyPreset(rows) {
    if (N < 5) { N = 5; buildSizeSeg(); }
    h = makeEmpty(N);
    var n = rows.length;
    rows.forEach(function (s, i) {
      var y = n - 1 - i;
      for (var x = 0; x < s.length; x++) {
        if (x < N && y < N) { h[x][y] = +s[x]; }
      }
    });
    buildPlan(); update();
  }
  function randomShape() {
    h = makeEmpty(N);
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      if (Math.random() < 0.55) { h[x][y] = 1 + Math.floor(Math.random() * 3); }
    }
    buildPlan(); update();
  }

  /* ---------- 保存(この端末だけの便利機能) ---------- */
  function save() {
    try { localStorage.setItem('tsumiki-seizu', JSON.stringify({ N: N, h: h })); } catch (e) {}
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem('tsumiki-seizu'));
      if (d && d.N >= 3 && d.N <= 6 && Array.isArray(d.h) && d.h.length === d.N) {
        var ok = d.h.every(function (c) { return Array.isArray(c) && c.length === d.N && c.every(function (v) { return v >= 0 && v <= MAXH; }); });
        if (ok) { N = d.N; h = d.h; return true; }
      }
    } catch (e) {}
    return false;
  }

  /* ---------- 立体の情報 ---------- */
  function info() {
    var minx = 99, maxx = -1, miny = 99, maxy = -1, H = 0, count = 0;
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      var v = h[x][y];
      if (v > 0) {
        count += v; H = Math.max(H, v);
        minx = Math.min(minx, x); maxx = Math.max(maxx, x);
        miny = Math.min(miny, y); maxy = Math.max(maxy, y);
      }
    }
    if (!count) { return null; }
    return { minx: minx, maxx: maxx, miny: miny, maxy: maxy, W: maxx - minx + 1, D: maxy - miny + 1, H: H, count: count };
  }
  function occ(x, y, z) { return x >= 0 && y >= 0 && x < N && y < N && z >= 0 && h[x][y] > z; }

  /* ---------- 等角図・キャビネット図 ---------- */
  function projFn(kind) {
    if (kind === 'iso') {
      var c = Math.cos(Math.PI / 6);
      return function (x, y, z) { return [c * (x + y), 0.5 * (x - y) - z]; };
    }
    var a = angle * Math.PI / 180;
    return function (x, y, z) { return [x + 0.5 * Math.cos(a) * y, -z - 0.5 * Math.sin(a) * y]; };
  }
  function fmt(n) { return n.toFixed(3); }

  function solid(kind, S) {
    var P = projFn(kind);
    var a = angle * Math.PI / 180;
    var kx = kind === 'iso' ? 1 : 0.5 * Math.cos(a);
    var kz = kind === 'iso' ? 1 : 0.5 * Math.sin(a);
    var cubes = [];
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) for (var z = 0; z < h[x][y]; z++) {
      cubes.push({ x: x, y: y, z: z, k: kx * x - y + kz * z });
    }
    cubes.sort(function (p, q) { return p.k - q.k; });
    var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9, out = '';
    function add(cls, corners) {
      var pts = corners.map(function (c) {
        var p = P(c[0], c[1], c[2]);
        minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
        minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
        return fmt(p[0]) + ',' + fmt(p[1]);
      });
      out += '<polygon class="' + cls + '" points="' + pts.join(' ') + '"/>';
    }
    cubes.forEach(function (c) {
      var x = c.x, y = c.y, z = c.z;
      if (!occ(x, y, z + 1)) { add('f-top', [[x, y, z + 1], [x + 1, y, z + 1], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]]); }
      if (!occ(x, y - 1, z)) { add('f-front', [[x, y, z], [x + 1, y, z], [x + 1, y, z + 1], [x, y, z + 1]]); }
      if (!occ(x + 1, y, z)) { add('f-right', [[x + 1, y, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x + 1, y, z + 1]]); }
    });
    var pad = 0.35, w = maxX - minX + 2 * pad, hh = maxY - minY + 2 * pad;
    var label = kind === 'iso' ? '等角図' : 'キャビネット図';
    return '<svg class="solid" role="img" aria-label="' + label + '" viewBox="' + fmt(minX - pad) + ' ' + fmt(minY - pad) + ' ' + fmt(w) + ' ' + fmt(hh) + '" style="width:min(100%,' + Math.round(w * S) + 'px)">' + out + '</svg>';
  }

  /* ---------- 正投影図(第三角法) ---------- */
  function ortho(S) {
    var b = info();
    var W = b.W, D = b.D, H = b.H, gap = 1.3;
    var ex = [1e9, 1e9, -1e9, -1e9];
    function ext(x0, y0, x1, y1) { ex = [Math.min(ex[0], x0), Math.min(ex[1], y0), Math.max(ex[2], x1), Math.max(ex[3], y1)]; }

    var frontFn = function (c, r) {
      var x = b.minx + c, z = H - 1 - r;
      for (var y = 0; y < N; y++) { if (h[x][y] > z) { return y; } }
      return null;
    };
    var planFn = function (c, r) {
      var x = b.minx + c, y = b.maxy - r;
      return h[x][y] > 0 ? h[x][y] : null;
    };
    var rightFn = function (c, r) {
      var y = b.miny + c, z = H - 1 - r;
      for (var x = N - 1; x >= 0; x--) { if (h[x][y] > z) { return x; } }
      return null;
    };

    function drawView(ox, oy, cols, rows, fn, name) {
      var fill = '', bold = '', thin = '', r, c;
      for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
        if (fn(c, r) !== null) { fill += '<rect x="' + (ox + c) + '" y="' + (oy + r) + '" width="1" height="1"/>'; }
      }
      for (r = 0; r <= rows; r++) for (c = 0; c < cols; c++) {
        var up = r > 0 ? fn(c, r - 1) : null, dn = r < rows ? fn(c, r) : null;
        if (up !== dn) { bold += 'M' + (ox + c) + ' ' + (oy + r) + 'h1'; }
        else if (up !== null && showGrid) { thin += 'M' + (ox + c) + ' ' + (oy + r) + 'h1'; }
      }
      for (c = 0; c <= cols; c++) for (r = 0; r < rows; r++) {
        var lf = c > 0 ? fn(c - 1, r) : null, rt = c < cols ? fn(c, r) : null;
        if (lf !== rt) { bold += 'M' + (ox + c) + ' ' + (oy + r) + 'v1'; }
        else if (lf !== null && showGrid) { thin += 'M' + (ox + c) + ' ' + (oy + r) + 'v1'; }
      }
      var cx = ox + cols / 2, ly = oy - 0.3;
      ext(ox, oy, ox + cols, oy + rows);
      if (showLabels) { ext(cx - 1.1, ly - 0.45, cx + 1.1, ly + 0.1); }
      return '<g class="ofill">' + fill + '</g>' +
        (thin ? '<path class="o-thin" d="' + thin + '"/>' : '') +
        (bold ? '<path class="o-bold" d="' + bold + '"/>' : '') +
        (showLabels ? '<text class="lab" x="' + fmt(cx) + '" y="' + fmt(ly) + '" font-size="0.42" text-anchor="middle">' + name + '</text>' : '');
    }

    var out = '';
    out += drawView(0, 0, W, D, planFn, '平面図');
    out += drawView(0, D + gap, W, H, frontFn, '正面図');
    out += drawView(W + gap, D + gap, D, H, rightFn, '右側面図');

    var pad = 0.45, w = ex[2] - ex[0] + 2 * pad, hh = ex[3] - ex[1] + 2 * pad;
    return '<svg role="img" aria-label="正投影図(平面図・正面図・右側面図)" viewBox="' + fmt(ex[0] - pad) + ' ' + fmt(ex[1] - pad) + ' ' + fmt(w) + ' ' + fmt(hh) + '" style="width:min(100%,' + Math.round(w * S) + 'px)">' + out + '</svg>';
  }

  /* ---------- 軸の凡例 ---------- */
  function legend(kind) {
    var P = projFn(kind), L = 34;
    var axes = [['x', P(1, 0, 0)], ['y', P(0, 1, 0)], ['z', P(0, 0, 1)]];
    var minX = 0, maxX = 0, minY = 0, maxY = 0, body = '';
    axes.forEach(function (a) {
      var dx = a[1][0], dy = a[1][1], len = Math.sqrt(dx * dx + dy * dy);
      var ux = dx / len, uy = dy / len;
      var tx = dx * L, ty = dy * L;
      var nx = -uy, ny = ux;
      var bx = tx - ux * 8, by = ty - uy * 8;
      body += '<line x1="0" y1="0" x2="' + fmt(bx) + '" y2="' + fmt(by) + '"/>' +
        '<polygon points="' + fmt(tx) + ',' + fmt(ty) + ' ' + fmt(bx + nx * 3.6) + ',' + fmt(by + ny * 3.6) + ' ' + fmt(bx - nx * 3.6) + ',' + fmt(by - ny * 3.6) + '"/>';
      var lx = tx + ux * 12, ly = ty + uy * 12 + 4.5;
      body += '<text x="' + fmt(lx) + '" y="' + fmt(ly) + '" text-anchor="middle">' + a[0] + '</text>';
      minX = Math.min(minX, tx, lx - 6); maxX = Math.max(maxX, tx, lx + 6);
      minY = Math.min(minY, ty, ly - 12); maxY = Math.max(maxY, ty, ly + 4);
    });
    var pad = 4, w = maxX - minX + 2 * pad, hh = maxY - minY + 2 * pad;
    return '<svg class="axis" role="img" aria-label="座標軸の向き" width="' + Math.round(w) + '" height="' + Math.round(hh) + '" viewBox="' + fmt(minX - pad) + ' ' + fmt(minY - pad) + ' ' + fmt(w) + ' ' + fmt(hh) + '">' + body + '</svg>' +
      '<span>x 幅　y 奥行　z 高さ</span>';
  }

  /* ---------- 説明文 ---------- */
  function noteText() {
    if (view === 'iso') { return '等角図は、x・y・zの3本の軸が互いに120°になるように描きます。x軸とy軸は水平線から30°で、どの方向も実際の長さのまま描きます。'; }
    if (view === 'cabinet') { return 'キャビネット図は、正面(x・z)を実際の形のまま描き、奥行き(y)を水平線から' + angle + '°の斜めの線で、長さを2分の1にして描きます。'; }
    if (view === 'ortho') { return '正投影図は第三角法で並べます。正面図の上に真上から見た平面図、右に右から見た右側面図を置きます。太線は面の段差や外形を表します。'; }
    return '同じ立体を3つの方法で並べました。奥行きの表し方の違いを見比べてみましょう。';
  }

  /* ---------- 描画 ---------- */
  function update() {
    var b = info();
    sheetEl.className = 'sheet' + (paperGrid ? '' : ' nogrid') + (shade ? '' : ' noshade') + (view === 'all' ? ' multi' : '');
    $('#note').textContent = noteText();
    $('#labelOpt').hidden = !(view === 'ortho' || view === 'all');
    $('#export').disabled = !b;
    $('#angleOpt').hidden = !(view === 'cabinet' || view === 'all');
    $('#shadeOpt').hidden = view === 'ortho';
    $('#gridOpt').hidden = !(view === 'ortho' || view === 'all');

    if (!b) {
      sheetEl.className = 'sheet' + (paperGrid ? '' : ' nogrid');
      sheetEl.innerHTML = '<p class="empty">立体の入力盤のマスをタップすると、立方体が積まれて図が描かれます。</p>';
      $('#legend').innerHTML = '';
      $('#stats').textContent = '立方体 0個';
      save();
      return;
    }

    if (view === 'all') {
      var cap = function (t) { return showLabels ? '<figcaption>' + t + '</figcaption>' : ''; };
      sheetEl.innerHTML =
        '<figure>' + cap('等角図') + solid('iso', 38) + '</figure>' +
        '<figure>' + cap('キャビネット図') + solid('cabinet', 38) + '</figure>' +
        '<figure class="wide">' + cap('正投影図(第三角法)') + ortho(32) + '</figure>';
    } else if (view === 'ortho') {
      sheetEl.innerHTML = ortho(52);
    } else {
      sheetEl.innerHTML = solid(view, 62);
    }
    $('#legend').innerHTML = (view === 'iso' || view === 'cabinet') ? legend(view) : '';
    $('#stats').textContent = '立方体 ' + b.count + '個　幅' + b.W + '×奥行' + b.D + '×高さ' + b.H;
    save();
  }

  /* ---------- 入力盤 ---------- */
  function paintCell(btn) {
    var x = +btn.dataset.x, y = +btn.dataset.y, v = h[x][y];
    btn.textContent = v ? String(v) : '';
    btn.style.setProperty('--p', String(Math.round(v / MAXH * 50)));
    btn.setAttribute('aria-label', (x + 1) + '列目・手前から' + (y + 1) + '段目:' + v + '個');
  }
  function buildPlan() {
    planEl.innerHTML = '';
    planEl.style.gridTemplateColumns = 'repeat(' + N + ', minmax(0, 1fr))';
    for (var r = 0; r < N; r++) for (var x = 0; x < N; x++) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'cell';
      btn.dataset.x = String(x); btn.dataset.y = String(N - 1 - r);
      paintCell(btn);
      planEl.appendChild(btn);
    }
  }
  planEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.cell');
    if (!btn) { return; }
    var x = +btn.dataset.x, y = +btn.dataset.y;
    h[x][y] = mode === 'add' ? Math.min(MAXH, h[x][y] + 1) : Math.max(0, h[x][y] - 1);
    paintCell(btn);
    update();
  });

  function resize(n) {
    var nh = makeEmpty(n);
    for (var x = 0; x < Math.min(n, N); x++) for (var y = 0; y < Math.min(n, N); y++) { nh[x][y] = h[x][y]; }
    N = n; h = nh;
    buildSizeSeg(); buildPlan(); update();
  }
  function buildSizeSeg() {
    var seg = $('#sizeSeg');
    seg.innerHTML = '';
    [4, 5, 6].forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn'; b.textContent = n + '×' + n;
      b.setAttribute('aria-pressed', String(n === N));
      b.addEventListener('click', function () { resize(n); });
      seg.appendChild(b);
    });
  }

  /* ---------- 操作 ---------- */
  var TABS = [['iso', '等角図'], ['cabinet', 'キャビネット図'], ['ortho', '正投影図'], ['all', '並べて比べる']];
  function buildTabs() {
    var el = $('#tabs');
    el.innerHTML = '';
    TABS.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn'; b.setAttribute('role', 'tab');
      b.textContent = t[1];
      b.setAttribute('aria-selected', String(t[0] === view));
      b.addEventListener('click', function () { view = t[0]; buildTabs(); update(); });
      el.appendChild(b);
    });
  }
  function buildAngle() {
    var seg = $('#angleSeg');
    seg.innerHTML = '';
    [30, 45, 60].forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn'; b.textContent = a + '°';
      b.setAttribute('aria-pressed', String(a === angle));
      b.addEventListener('click', function () { angle = a; buildAngle(); update(); });
      seg.appendChild(b);
    });
  }
  function buildPresets() {
    var el = $('#presets');
    PRESETS.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn'; b.textContent = p[0];
      b.addEventListener('click', function () { applyPreset(p[1]); });
      el.appendChild(b);
    });
    var r = document.createElement('button');
    r.type = 'button'; r.className = 'btn'; r.textContent = 'ランダム';
    r.addEventListener('click', randomShape);
    el.appendChild(r);
    var c = document.createElement('button');
    c.type = 'button'; c.className = 'btn'; c.textContent = 'すべて取る';
    c.addEventListener('click', function () { h = makeEmpty(N); buildPlan(); update(); });
    el.appendChild(c);
  }

  $('#modeSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) { return; }
    mode = b.dataset.mode;
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  });
  $('#shade').addEventListener('change', function () { shade = this.checked; update(); });
  $('#grid').addEventListener('change', function () { showGrid = this.checked; update(); });

  /* ---------- 用紙(方眼の有無) ---------- */
  function buildPaper() {
    var seg = $('#paperSeg');
    seg.innerHTML = '';
    [[true, '方眼あり'], [false, '方眼なし(白)']].forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn'; b.textContent = p[1];
      b.setAttribute('aria-pressed', String(p[0] === paperGrid));
      b.addEventListener('click', function () { paperGrid = p[0]; buildPaper(); update(); });
      seg.appendChild(b);
    });
  }
  $('#labels').addEventListener('change', function () { showLabels = this.checked; update(); });

  /* ---------- JPEG出力 ---------- */
  var EXPORT_FONT = '"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';
  var UNIT = 120;          /* 立方体1辺の書き出しピクセル数 */
  var STROKE_SCALE = 1.25; /* 紙に出したときに線が細くならないよう少し太くする */
  var previewUrl = null;

  function rasterize(svg) {
    return new Promise(function (resolve, reject) {
      var vb = svg.viewBox.baseVal;
      var rw = svg.getBoundingClientRect().width;
      var ppu = rw > 0 ? rw / vb.width : 60;
      var clone = svg.cloneNode(true);
      var live = svg.querySelectorAll('*'), cl = clone.querySelectorAll('*');
      for (var i = 0; i < live.length; i++) {
        var cs = getComputedStyle(live[i]), el = cl[i], tag = el.tagName.toLowerCase();
        el.removeAttribute('class'); el.removeAttribute('style');
        if (tag === 'g') { continue; }
        el.setAttribute('fill', cs.fill);
        if (tag === 'text') {
          el.setAttribute('font-family', EXPORT_FONT);
          el.setAttribute('font-weight', '700');
        } else {
          el.setAttribute('stroke', cs.stroke);
          el.setAttribute('stroke-width', String(parseFloat(cs.strokeWidth) / ppu * STROKE_SCALE));
          el.setAttribute('stroke-linejoin', cs.strokeLinejoin);
          el.setAttribute('stroke-linecap', cs.strokeLinecap);
        }
      }
      var w = Math.round(vb.width * UNIT), hh = Math.round(vb.height * UNIT);
      clone.removeAttribute('class'); clone.removeAttribute('style');
      clone.setAttribute('width', String(w)); clone.setAttribute('height', String(hh));
      var str = new XMLSerializer().serializeToString(clone);
      if (!/xmlns=/.test(str)) { str = str.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"'); }
      var url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml;charset=utf-8' }));
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve({ img: img, w: w, h: hh }); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('svg')); };
      img.src = url;
    });
  }

  function makeJpeg() {
    var items = [];
    if (view === 'all') {
      sheetEl.querySelectorAll('figure').forEach(function (f) {
        var c = f.querySelector('figcaption');
        items.push({ cap: c ? c.textContent : '', svg: f.querySelector('svg') });
      });
    } else {
      var s = sheetEl.querySelector('svg');
      if (s) { items.push({ cap: '', svg: s }); }
    }
    if (!items.length) { return Promise.reject(new Error('empty')); }
    return Promise.all(items.map(function (it) { return rasterize(it.svg); })).then(function (rs) {
      var PAD = 80, GAP = 70, CAPH = 56;
      var W = 0, H = PAD * 2;
      rs.forEach(function (r, i) {
        W = Math.max(W, r.w);
        H += r.h + (items[i].cap ? CAPH : 0) + (i ? GAP : 0);
      });
      W = Math.max(720, W + PAD * 2); H = Math.max(520, H);
      var cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
      if (paperGrid) {
        var pitch = UNIT / 2;
        ctx.strokeStyle = '#D3DCE5'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (var gx = 0; gx <= W; gx += pitch) { ctx.moveTo(gx + 0.5, 0); ctx.lineTo(gx + 0.5, H); }
        for (var gy = 0; gy <= H; gy += pitch) { ctx.moveTo(0, gy + 0.5); ctx.lineTo(W, gy + 0.5); }
        ctx.stroke();
      }
      var total = PAD * 2 - PAD * 2;
      rs.forEach(function (r, i) { total += r.h + (items[i].cap ? CAPH : 0) + (i ? GAP : 0); });
      var y = Math.max(PAD, Math.round((H - total) / 2));
      rs.forEach(function (r, i) {
        if (i) { y += GAP; }
        if (items[i].cap) {
          ctx.fillStyle = '#4A5B6B'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
          ctx.font = '700 30px ' + EXPORT_FONT;
          ctx.fillText(items[i].cap, W / 2, y + 34);
          y += CAPH;
        }
        ctx.drawImage(r.img, Math.round((W - r.w) / 2), y, r.w, r.h);
        y += r.h;
      });
      return new Promise(function (resolve, reject) {
        cv.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error('blob')); }, 'image/jpeg', 0.95);
      });
    });
  }

  function showPreview(blob, name, text) {
    var box = $('#preview');
    if (previewUrl) { URL.revokeObjectURL(previewUrl); }
    previewUrl = URL.createObjectURL(blob);
    box.innerHTML = '';
    var p = document.createElement('p'); p.textContent = text;
    var im = document.createElement('img'); im.src = previewUrl; im.alt = name;
    box.appendChild(p); box.appendChild(im);
    box.hidden = false;
  }

  $('#export').addEventListener('click', function () {
    var btn = this, msg = $('#exportMsg'), name = ({ iso: '等角図', cabinet: 'キャビネット図', ortho: '正投影図', all: '3つの図' })[view] + '.jpg';
    btn.disabled = true; msg.textContent = '画像を作っています…'; $('#preview').hidden = true;
    makeJpeg().then(function (blob) {
      if (!dl) {
        showPreview(blob, name, 'この画面からは直接保存できません。下の画像を長押し(パソコンでは右クリック)して保存してください。');
        msg.textContent = '';
        return;
      }
      return dl.save({ filename: name, data: blob }).then(function () {
        msg.textContent = '保存しました。';
      }, function (err) {
        var code = err && err.code;
        if (code === 'declined') { msg.textContent = '保存をキャンセルしました。'; }
        else if (code === 'rate_limited') { msg.textContent = '少し待ってから、もう一度押してください。'; }
        else {
          msg.textContent = '';
          showPreview(blob, name, '保存できなかったので、画像を表示しました。長押し(右クリック)で保存できます。');
        }
      });
    }).catch(function () {
      msg.textContent = '画像を作れませんでした。もう一度お試しください。';
    }).then(function () { btn.disabled = !info(); });
  });

  /* ---------- 起動 ---------- */
  if (!load()) {
    applyPreset(PRESETS[0][1]);
  }
  buildTabs(); buildAngle(); buildPaper(); buildPresets(); buildSizeSeg(); buildPlan(); update();
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (d) { dl = d; }, function () {});
    }
  } catch (e) {}
})();
</script>

</body></html>
